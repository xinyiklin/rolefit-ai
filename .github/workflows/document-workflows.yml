name: Document workflow CI

on:
  pull_request:
    paths:
      - "apps/role-fit-ai/**"
      - "apps/typeset/**"
      - "packages/**"
      - "scripts/editor-browser-contracts*"
      - "scripts/editor-browser-contracts/**"
      - "scripts/check-dependency-contracts.mjs"
      - "scripts/check-package-script-paths.mjs"
      - ".node-version"
      - ".npmrc"
      - ".github/dependabot.yml"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.base.json"
      - ".github/workflows/document-workflows.yml"
  push:
    branches: [main]
    paths:
      - "apps/role-fit-ai/**"
      - "apps/typeset/**"
      - "packages/**"
      - "scripts/editor-browser-contracts*"
      - "scripts/editor-browser-contracts/**"
      - "scripts/check-dependency-contracts.mjs"
      - "scripts/check-package-script-paths.mjs"
      - ".node-version"
      - ".npmrc"
      - ".github/dependabot.yml"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.base.json"
      - ".github/workflows/document-workflows.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: document-workflows-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dependencies:
    name: Runtime and dependency contracts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          package-manager-cache: false
      - run: npm ci
      - run: npm run deps:check
      # `npm ci` proves the manifests and lockfile agree; it does not prove the
      # resolved tree is internally valid or free of production advisories.
      - run: npm run deps:tree
      - run: npm run deps:audit:production

  typescript-native:
    name: TypeScript 7 native (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux x64
            runner: ubuntu-24.04
            architecture: x64
            platform: linux
          - label: Linux ARM64
            runner: ubuntu-24.04-arm
            architecture: arm64
            platform: linux
          - label: macOS ARM64
            runner: macos-15
            architecture: arm64
            platform: darwin
          - label: macOS x64
            runner: macos-15-intel
            architecture: x64
            platform: darwin
          - label: Windows x64
            runner: windows-2025
            architecture: x64
            platform: win32
    runs-on: ${{ matrix.runner }}
    env:
      EXPECTED_TYPESCRIPT_ARCH: ${{ matrix.architecture }}
      EXPECTED_TYPESCRIPT_PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          architecture: ${{ matrix.architecture }}
          package-manager-cache: false
      - run: npm ci
      - run: npm run deps:check
      - run: npm run types:check

  engine:
    name: Engine codecs, layout, PDF, and fonts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          package-manager-cache: false
      - run: npm ci
      # generate_font_assets.py --check refetches every pinned upstream source
      # on a cold runner, so a slow CTAN or raw.githubusercontent response fails
      # the job on a 60s socket timeout. Every source is pinned to an immutable
      # commit or release, so the cache key only has to track the scripts that
      # name those pins.
      - name: Cache pinned upstream font sources
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/typeset-fonts
          key: >-
            typeset-font-sources-${{ runner.os }}-${{
              hashFiles('packages/engine/scripts/generate_font_assets.py',
                        'packages/engine/scripts/requirements-fonts.txt') }}
      - run: |
          python3 -m venv .font-tools
          .font-tools/bin/pip install --requirement packages/engine/scripts/requirements-fonts.txt
          echo "$GITHUB_WORKSPACE/.font-tools/bin" >> "$GITHUB_PATH"
          echo "SSL_CERT_FILE=$("$GITHUB_WORKSPACE/.font-tools/bin/python" -m certifi)" >> "$GITHUB_ENV"
      - run: npm run check --workspace packages/engine

  editor:
    name: Shared editor
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          package-manager-cache: false
      - run: npm ci
      - run: npm run check --workspace packages/editor

  typeset:
    name: Typeset app
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          package-manager-cache: false
      - run: npm ci
      - run: npm run check --workspace apps/typeset

  rolefit:
    name: RoleFit app and landing
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          package-manager-cache: false
      - run: npm ci
      - run: npm run check --workspace apps/role-fit-ai

  server:
    name: RoleFit server transactions
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          package-manager-cache: false
      - run: npm ci
      - run: npx tsc -p apps/role-fit-ai/tsconfig.server.json --noEmit
      - run: npm run test:document-workflows --workspace apps/role-fit-ai
      - run: npm run test:server-lifecycle --workspace apps/role-fit-ai

  browser:
    name: Chromium editor contracts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          package-manager-cache: false
      - run: npm ci
      - run: npm run test:editor:browser
