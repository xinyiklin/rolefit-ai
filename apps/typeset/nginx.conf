# The image's /etc/nginx/conf.d/default.conf: unprivileged nginx serving the
# built app on 8080 (the host maps loopback 5186 to it). It replaces the stock
# file to send the response headers a static, local-first editor should carry.

# Vite names bundled assets by content hash. Everything else (index.html, the
# mirrored engine fonts, the favicon) keeps a stable name and must revalidate
# so a deploy is picked up on the next load. Keyed on the status too: a 404
# for a chunk an old tab still asks for must not be cached for a year.
map "$status:$uri" $typeset_cache_control {
    ~^(?:200|304):/assets/  "public, max-age=31536000, immutable";
    default                 "no-cache";
}

server {
    # IPv4 only: the host maps the port over loopback IPv4, and an IPv6
    # listener would stop nginx on a host without IPv6. (The image's entrypoint
    # adds one only to its own stock file, which this replaces.)
    listen       8080;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;
    # Directory redirects would otherwise name the container's internal port.
    absolute_redirect off;

    # The same policy RoleFit's packaged server sends for this engine and
    # editor, minus the development-only WebSocket sources. `always` keeps the
    # headers on error responses too.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data: blob:; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' blob:; worker-src 'self' blob:; child-src 'self' blob:" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cache-Control $typeset_cache_control always;

    # The bundle is mostly text (the engine's font metrics alone are 5.4 MB);
    # WOFF2 fonts are already compressed.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    location / {
        try_files $uri $uri/ =404;
    }
}
